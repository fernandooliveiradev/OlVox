name: Build installers
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - name: Build executable and installer
        shell: cmd
        run: build_windows.bat
      - name: Install silently
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\dist\OlVox_Setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$PWD\installed" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          if (!(Test-Path "$PWD\installed\OlVox.exe")) { throw 'Installed executable missing' }
      - name: Test installed application and transcription
        run: .venv\Scripts\python.exe scripts/test_packaged.py installed/OlVox.exe tests/data/jfk.flac
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OlVox-Windows
          path: dist/OlVox_Setup.exe
          if-no-files-found: error
          compression-level: 0

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - name: Build executable
        run: bash build_linux.sh
      - name: Test application and transcription
        run: .venv/bin/python scripts/test_packaged.py dist/OlVox/OlVox tests/data/jfk.flac
      - name: Build Debian package
        run: |
          mkdir -p package/DEBIAN package/opt/olvox package/usr/bin package/usr/share/applications package/usr/share/icons/hicolor/256x256/apps
          cp -a dist/OlVox/. package/opt/olvox/
          ln -s /opt/olvox/OlVox package/usr/bin/olvox
          cp assets/vox-256.png package/usr/share/icons/hicolor/256x256/apps/olvox.png
          printf '[Desktop Entry]\nType=Application\nName=OlVox\nExec=/opt/olvox/OlVox\nIcon=olvox\nCategories=AudioVideo;Audio;\nTerminal=false\n' > package/usr/share/applications/olvox.desktop
          printf 'Package: olvox\nVersion: 1.0.0\nSection: sound\nPriority: optional\nArchitecture: amd64\nMaintainer: OlVox contributors\nDepends: libc6 (>= 2.35), libgl1, libnss3, libxkbcommon0, libegl1, libdbus-1-3\nDescription: Local audio and video transcription\n' > package/DEBIAN/control
          dpkg-deb --build --root-owner-group package OlVox-Linux-amd64.deb
          dpkg-deb --info OlVox-Linux-amd64.deb
      - name: Test installed Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./OlVox-Linux-amd64.deb
          .venv/bin/python scripts/test_packaged.py /opt/olvox/OlVox tests/data/jfk.flac
      - uses: actions/upload-artifact@v4
        with:
          name: OlVox-Linux
          path: OlVox-Linux-amd64.deb
          if-no-files-found: error
          compression-level: 0
